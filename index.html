<header>
    <h1>🌱 AgroMonitor</h1>
    <p>Monitoramento inteligente da umidade do solo</p>
</header>

<main class="container">

    <section class="card">
        <h2>💧 Umidade atual</h2>

        <div class="umidade">
            <span id="valorUmidade">--</span>%
        </div>

        <div class="barra">
            <div id="barraUmidade"></div>
        </div>

        <p id="status">Aguardando leitura...</p>
    </section>

    <section class="card informacoes">
        <h2>📊 Informações</h2>

        <div class="info">
            <span>🌡️ Temperatura</span>
            <strong id="temperatura">-- °C</strong>
        </div>

        <div class="info">
            <span>💧 Umidade</span>
            <strong id="umidadeInfo">--%</strong>
        </div>

        <div class="info">
            <span>🕒 Última leitura</span>
            <strong id="ultimaLeitura">--</strong>
        </div>
    </section>

    <section id="alerta" class="alerta">
        ⚠️ Atenção: o solo está muito seco!
    </section>

    <div class="acoes">
        <button class="btn-atualizar" onclick="atualizarDados()">
            🔄 Atualizar leitura
        </button>
    </div>

</main>

<button class="btn-tema" id="btnTema" type="button">
    🌙 Modo escuro
</button>

<button class="btn-voltar-topo" type="button">
    ⬆️ Voltar ao topo
</button>

<footer>
    <p>🌾 Sistema de Agricultura Inteligente</p>
    <p>AgroMonitor • Tecnologia a favor do campo</p>
</footer>

<script src="script.js"></script>
