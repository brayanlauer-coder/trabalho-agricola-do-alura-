<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Umidade do Solo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌱 AgroMonitor</h1>
        <p>Monitoramento da umidade do solo</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Umidade atual</h2>

            <div class="umidade">
                <span id="valorUmidade">--</span>%
            </div>

            <div class="barra">
                <div id="barraUmidade"></div>
            </div>

            <p id="status">Aguardando leitura...</p>
        </section>

        <section class="card informacoes">
            <h2>Informações</h2>

            <div class="info">
                <span>🌡️ Temperatura</span>
                <strong id="temperatura">-- °C</strong>
            </div>

            <div class="info">
                <span>💧 Umidade</span>
                <strong id="umidadeInfo">--%</strong>
            </div>

            <div class="info">
                <span>🕒 Última leitura</span>
                <strong id="ultimaLeitura">--</strong>
            </div>
        </section>

        <section id="alerta" class="alerta">
            ⚠️ Atenção: o solo está muito seco!
        </section>

        <button onclick="atualizarDados()">
            🔄 Atualizar leitura
        </button>

    </main>

    <footer>
        <p>🌾 Sistema de Agricultura Inteligente</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
